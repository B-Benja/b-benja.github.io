cv:
  name: Benjamin Buettner
  headline: Applied economics of Innovation & Data Scientist
  location: Pisa, Italy
  sections:
    Profile:
    - I study how scientific and technical knowledge spreads and how inventors and firms decide which
      technologies to develop. My research combines large-scale patent and publication data with econometrics
      and machine learning. My current work focuses on technological choices and the incentives shaping
      the development of safer and more sustainable chemicals.
    Education:
    - institution: Eindhoven University of Technology
      area: Economics
      degree: PhD
      start_date: '2019'
      end_date: '2026'
    - institution: FAU Erlangen-Nürnberg
      area: Sociology
      degree: M.A.
      start_date: '2016'
      end_date: '2018'
    - institution: FAU Erlangen-Nürnberg
      area: Sociology & Pedagogy
      degree: B.A.
      start_date: '2011'
      end_date: '2016'
    Academic Positions:
    - company: Scuola Superiore Sant'Anna
      position: Postdoctoral Researcher
      start_date: '2026'
      summary: Working on [SUSTECH](https://cordis.europa.eu/project/id/101224873), an ERC Synergy Grant
        studying how inventors and firms choose which chemical compounds to develop and why potentially
        safer alternatives are sometimes overlooked.
      highlights:
      - Studying technological choices and incentives influencing chemical innovation.
      - Linking patent data to chemical structures and predicted properties.
      - Examining the role of economic incentives and regulation in technological choices.
    - company: Eindhoven University of Technology
      position: Postdoctoral Researcher
      start_date: '2024'
      end_date: '2026'
      summary: Developed methods to identify patent–paper pairs by matching text, figures, and metadata
        from patents and scientific articles using deep learning.
      highlights:
      - Trained neural networks for image- and text-based similarity.
      - Built pipelines to identify links between scientific publications and patents.
      - Constructed datasets to study the diffusion of scientific knowledge.
    - company: Eindhoven University of Technology
      position: PhD Candidate
      start_date: '2019'
      end_date: '2026'
      summary: Studied how language barriers, paywalls, and search costs affect the diffusion and use
        of scientific and technical knowledge.
      highlights:
      - Studied machine translation and cross-border patent citations.
      - Linked patent data to H-1B visa applications to study international recruitment.
      - Used image recognition to identify patent–paper pairs.
    Earlier Professional Experience:
    - company: Jiangsu University of Technology
      position: Lecturer & Team Leader
      start_date: '2017'
      end_date: '2019'
      summary: Managed an international academic team; taught cultural, sociological, and linguistic topics,
        including German language instruction.
    - company: Sophia University
      position: Researcher
      start_date: '2017'
      end_date: '2017'
      summary: Research on Western waste-management concepts in East Asia.
      highlights:
      - Collected data using T-SQL.
      - Conducted statistical analysis in R and Python.
    - company: Siemens AG
      position: Working Student, Export Control & Customs
      start_date: '2015'
      end_date: '2017'
      summary: Supported export-control and customs compliance; analyzed data with Excel, VBA, and Access.
    Publications:
    - name: 'Patents and knowledge diffusion: the impact of machine translation'
      date: '2022'
      url: https://doi.org/10.1016/j.respol.2022.104584
      summary: Research Policy. Examines the effects of machine translation on cross-border patent citations.
    - name: 'Deriving experience curves: a structured and critical approach applied to PV sector'
      date: '2024'
      summary: Technological Forecasting and Social Change. Develops a structured approach to experience
        curves in photovoltaics.
    Conference Papers and Presentations:
    - name: Patent Disclosure and Migration
      date: '2023'
      summary: Presented at EPIP 2023. Examines patent examiner citations, knowledge exposure, and international
        recruitment.
    - name: Unveiling Hidden Connections Between Science and Innovation
      date: '2024'
      url: https://doi.org/10.1016/j.techfore.2024.123795
      summary: Presented at EPIP 2024. Uses deep learning to identify patent–paper pairs.
    - name: 'Breaking the Paywall: Patents as Channels for Scientific Disclosure'
      date: '2025'
      summary: Presented at EPIP 2025. Studies whether patents provide alternative access to knowledge
        disclosed in paywalled scientific papers.
