    Experience:
      - company: Scuola Superiore Sant'Anna
        position: Postdoctoral Researcher
        location: Pisa, Italy
        start_date: 2026
        url: https://cordis.europa.eu/project/id/101224873
        summary: >-
          Researcher on SUSTECH, an ERC Synergy Grant investigating how inventors
          and firms choose which chemical compounds to develop, and why potentially
          safer alternatives are sometimes overlooked.
        highlights:
          - Studying technological choices and the incentives influencing the development of chemical compounds
          - Combining patent data with information on chemical structures and predicted properties
          - Examining how economic incentives and regulation influence the direction of technological change

      - company: Eindhoven University of Technology
        position: Postdoctoral Researcher
        start_date: 2024
        end_date: 2026
        summary: >-
          Developed scalable methods to identify patent–paper pairs using deep learning
          applied to text, figures, and metadata from patents and scientific articles.
        highlights:
          - Trained neural networks for image- and text-based similarity
          - Built scalable pipelines to detect direct links between research and innovation
          - Constructed and shared datasets for use by the broader research community

      - company: Eindhoven University of Technology
        position: PhD Candidate
        start_date: 2019
        end_date: 2026
        summary: >-
          Studied how diffusion barriers affect the reuse of scientific knowledge
          using patent data, machine learning, and econometrics.
        highlights:
          - Analyzed machine translation effects on cross-border citation flows
          - Linked patent data to H-1B visa records to study talent flows
          - Used image recognition to detect overlap between paywalled articles and patents

      - company: Jiangsu University of Technology
        position: Lecturer & Team Leader
        start_date: 2017
        end_date: 2019
        summary: >-
          Managed an international academic team; taught cultural, sociological,
          and linguistic topics, including German language instruction.

      - company: Sophia University
        position: Researcher
        start_date: 2017
        end_date: 2017
        summary: >-
          Participated in research evaluating Western waste management concepts in East Asia.
        highlights:
          - Collected data using T-SQL
          - Performed statistical analysis using R and Python

      - company: Siemens AG
        position: Working Student, Export Control & Customs
        start_date: 2015
        end_date: 2017
        summary: >-
          Assisted divisions worldwide on export compliance; analyzed data using Excel,
          VBA, and Access.

